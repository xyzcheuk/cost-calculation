<!DOCTYPE html>
<html lang="en">
<head>
  <title>Drawing Cost Calculation</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Drawing Cost Calculation</h1>
    <form>
      <div class="form-group">
        <label for="item1">Searching cost for drainage record plans or drawings ($10.4):</label>
        <input type="number" inputmode="decimal" min="0" step="any" class="form-control" id="item1">
      </div>
      <div class="form-group">
        <label for="item2">No. of A4 Drawings sold ($1.5):</label>
        <input type="number" inputmode="decimal" min="0" step="any" class="form-control" id="item2">
      </div>
      <div class="form-group">
        <label for="item3">No. of A3 Drawings sold ($1.6):</label>
        <input type="number" inputmode="decimal" min="0" step="any" class="form-control" id="item3">
      </div>

      <div class="form-group">
        <label for="item4">No. of A0 Drawings sold ($98):</label>
        <input type="number" inputmode="decimal" min="0" step="any" class="form-control" id="item4">
      </div>

      <button type="button" class="btn btn-primary" onclick="main()">Calculate Cost</button>
      <button type="button" class="btn btn-secondary" onclick="clearAll()">Clear All</button>
      <br></br>
      <div class="form-group">
        <label for="cost1">Searching cost:</label>
        <input type="number" class="form-control" id="cost1" readonly>
      </div>

      <div class="form-group">
        <label for="cost2">A4 Drawings cost:</label>
        <input type="number" class="form-control" id="cost2" readonly>
      </div>

      <div class="form-group">
        <label for="cost3">A3 Drawings cost:</label>
        <input type="number" class="form-control" id="cost3" readonly>
      </div>

      <div class="form-group">
        <label for="cost4">A0 Drawings cost:</label>
        <input type="number" class="form-control" id="cost4" readonly>
      </div>

      <div class="form-group">
        <label for="total">Total:</label>
        <input type="number" class="form-control" id="total" readonly>
      </div>

    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
